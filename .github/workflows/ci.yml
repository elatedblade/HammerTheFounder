name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://htf:htf@localhost:5432/htf
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: htf
          POSTGRES_USER: htf
          POSTGRES_PASSWORD: htf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U htf -d htf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Wait for PostgreSQL
        run: |
          python - <<'PY'
          import time

          import psycopg

          for _ in range(30):
              try:
                  with psycopg.connect("postgresql://htf:htf@localhost:5432/htf"):
                      break
              except psycopg.OperationalError:
                  time.sleep(2)
          else:
              raise SystemExit("PostgreSQL did not become ready in time")
          PY
      - run: python -m pytest -q
      - run: python manage.py check

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [client-web, admin-web]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
