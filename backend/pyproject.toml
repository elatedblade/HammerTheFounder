[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hammer-the-founder-backend"
version = "0.1.0"
description = "Django backend for Hammer the Founder"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.1,<6.0",
    "djangorestframework>=3.15,<4.0",
    "psycopg[binary]>=3.2,<4.0",
    "celery[redis]>=5.4,<6.0",
    "PyJWT[crypto]>=2.9,<3.0",
    "django-cors-headers>=4.7,<5.0",
    "boto3>=1.35,<2.0",
]

[project.optional-dependencies]
# Development and test dependencies are maintained here as the single source
# of truth. The Docker development build and CI install this extra explicitly.
dev = [
    "pytest>=8.0,<9.0",
    "pytest-django>=4.9,<5.0",
]

[tool.setuptools]
packages = [
    "config",
    "config.settings",
    "apps",
    "apps.users",
    "apps.users.migrations",
    "apps.candidates",
    "apps.candidates.migrations",
    "apps.resumes",
    "apps.resumes.migrations",
    "apps.integrations",
    "apps.integrations.auth",
    "apps.integrations.storage",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
