[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hammer-the-founder-backend"
version = "0.1.0"
description = "Django backend for Hammer the Founder"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.1,<6.0",
    "djangorestframework>=3.15,<4.0",
    "psycopg[binary]>=3.2,<4.0",
    "celery[redis]>=5.4,<6.0",
    "PyJWT[crypto]>=2.9,<3.0",
    "django-cors-headers>=4.7,<5.0",
    "boto3>=1.35,<2.0",
    "gunicorn>=23,<24",
    "sentry-sdk[django,celery]>=2.40,<3",
    "pypdf>=5,<7",
    "pydantic>=2.10,<3",
    "pydantic-ai-slim[openai]==1.0.18",
    "openai==1.109.1",
    "opentelemetry-api==1.37.0",
    "griffe>=1.3.2,<2",
    "httpx>=0.28.1,<0.29",
]

[project.optional-dependencies]
# Development and test dependencies are maintained here as the single source
# of truth. The Docker development build and CI install this extra explicitly.
dev = [
    "pytest>=8.0,<9.0",
    "pytest-django>=4.9,<5.0",
]

[tool.setuptools.packages.find]
include = ["config*", "apps*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
