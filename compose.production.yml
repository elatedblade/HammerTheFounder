# Standalone deployment topology: do not merge with development Compose.
# Put a TLS reverse proxy in front of the loopback-bound HTTP ports.
x-backend: &backend
  init: true
  build:
    context: ./backend
  env_file:
    - .env.production
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  backend:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    <<: *backend
    command: celery -A config worker --loglevel=WARNING --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.production
    restart: unless-stopped
    volumes:
      - postgres-production:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - redis-production:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  client-web:
    build:
      context: ./client-web
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set the public HTTPS API URL}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:?Set the public HTTPS admin URL}
        NEXT_PUBLIC_AUTH_MODE: clerk
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set Clerk public key}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    environment:
      NEXT_PUBLIC_AUTH_MODE: clerk
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set the server-only Clerk key}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
  admin-web:
    build:
      context: ./admin-web
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set the public HTTPS API URL}
        NEXT_PUBLIC_AUTH_MODE: clerk
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set Clerk public key}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    environment:
      NEXT_PUBLIC_AUTH_MODE: clerk
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set the server-only Clerk key}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-production:
  redis-production:
