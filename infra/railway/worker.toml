# Railway Celery worker service. Use the same backend source and locked image
# dependencies as the API service; this process does not expose an HTTP port.
[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/railway/backend.Dockerfile"

[deploy]
startCommand = "/bin/sh -c 'exec celery -A config worker --loglevel=INFO --concurrency=${CELERY_CONCURRENCY:-2}'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
